<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple sample login page">
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    .login-card {
      width: min(100%, 400px);
      padding: 32px;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgb(0 0 0 / 8%);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 1.8rem;
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: #6b7280;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font: inherit;
    }

    input:focus {
      border-color: #2563eb;
      outline: 3px solid rgb(37 99 235 / 18%);
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .help-text {
      margin: 18px 0 0;
      text-align: center;
      font-size: 0.9rem;
      color: #6b7280;
    }

    a {
      color: #2563eb;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account</p>

    <form action="#" method="post">
      <div class="form-group">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="username"
          placeholder="you@example.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
        >
      </div>

      <button type="submit">Sign in</button>
    </form>

    <p class="help-text">
      Forgot your password? <a href="#">Reset it</a>
    </p>
  </main>
</body>
</html>
